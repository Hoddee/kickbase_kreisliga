<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Matchday Punkte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Hauptseite wie die Kickbase-Spielerkarte (Punktemuster, Foto, große Punktzahl, Wappen, Liste je Aktion) mit einem Button unten.
   Zweite Ansicht ist die Punktevergabe mit Reitern unten. Die Stufenfarbe der Gesamtpunkte färbt nur den LIVE-Text, den Button und kleine Marker. */
:root {
  color-scheme: dark;
  --bg: #111112;
  --surface: #181A1C;
  --raised: #222528;
  --line: #2C2F33;
  --ink: #F4F5F6;
  --muted: #8E9399;
  --lime: #A8E05F;
  --hi: #2FD673;
  --neg: #FF5A2A;
  --lime-bg: rgba(168, 224, 95, .14);
  --hi-bg: rgba(47, 214, 115, .15);
  --neg-bg: rgba(255, 90, 42, .15);
  --tier: #F28C1B;
  --tier-rgb: 242, 140, 27;
  --on-tier: #1A1000;
  --font-display: 'Orbitron', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* Stufen: Minus dunkelrot, 0-99 orange, 100-199 hellgrün, 200-399 dunkelgrün, ab 400 gold */
body[data-tier="red"]     { --tier: #B3202A; --tier-rgb: 179, 32, 42;  --on-tier: #FFFFFF; }
body[data-tier="orange"]  { --tier: #F28C1B; --tier-rgb: 242, 140, 27; --on-tier: #1A1000; }
body[data-tier="lime"]    { --tier: #A8E05F; --tier-rgb: 168, 224, 95; --on-tier: #0F1C06; }
body[data-tier="emerald"] { --tier: #1FC46A; --tier-rgb: 31, 196, 106; --on-tier: #03170C; }
body[data-tier="gold"]    { --tier: #E8B825; --tier-rgb: 232, 184, 37; --on-tier: #1F1600; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14.5px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
.wrap {
  width: 100%; max-width: 560px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--tier); outline-offset: 2px; }

/* ---------- Hauptseite ---------- */
.hero {
  --pw: clamp(230px, 74vw, 310px);
  position: relative; isolation: isolate; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background-image: radial-gradient(circle, rgba(255, 255, 255, .36) 2px, transparent 2.5px);
  background-size: 26px 26px; background-position: center top;
  -webkit-mask-image: linear-gradient(#000 0%, #000 42%, transparent 82%);
  mask-image: linear-gradient(#000 0%, #000 42%, transparent 82%);
}
.hero::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60%; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(17, 17, 18, 0), rgba(17, 17, 18, .8) 60%, var(--bg) 100%);
}
.hero-in { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 12px; }
.grab { position: relative; z-index: 3; width: 56px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .28); margin-bottom: 14px; }
.photo {
  position: relative; z-index: 1; width: var(--pw); aspect-ratio: 522 / 810;
  -webkit-mask-image: linear-gradient(#000 72%, transparent 100%);
  mask-image: linear-gradient(#000 72%, transparent 100%);
}
.photo img { display: block; width: 100%; height: 100%; object-fit: contain; }
.hero-text {
  position: relative; z-index: 2; width: 100%; text-align: center;
  margin-top: calc(var(--pw) * -.52); padding-bottom: 22px;
}
.pname { font-weight: 500; font-size: 18px; letter-spacing: .02em; color: rgba(255, 255, 255, .72); min-height: 26px; }
.num {
  font: 800 clamp(70px, 23vw, 100px)/1.05 var(--font-display); letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; margin: 4px 0 10px; color: rgba(255, 255, 255, .94);
}
.num[data-len="4"] { font-size: clamp(56px, 17vw, 80px); }
.num[data-len="5"] { font-size: clamp(46px, 13.5vw, 66px); }
.match { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; max-width: 320px; margin: 0 auto; }
.badge {
  justify-self: center; width: 58px; height: 58px; border-radius: 50%; background: #FFFFFF;
  display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(255, 255, 255, .12);
}
.badge img { width: 70%; height: 70%; object-fit: contain; display: block; }
.mid { text-align: center; min-width: 96px; }
.sc { font: 500 32px/1.1 var(--font-body); letter-spacing: .08em; color: rgba(255, 255, 255, .86); font-variant-numeric: tabular-nums; }
.state { margin-top: 3px; font-weight: 600; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.state.live { color: var(--tier); }

.rows-wrap { padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
.rows { list-style: none; margin: 0; padding: 6px 0 0; }
.row {
  display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 18px 16px; margin-bottom: 10px;
  border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .015);
}
.rp { font: 700 19px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.rl { min-width: 0; font-size: 16.5px; font-weight: 400; overflow-wrap: anywhere; }
.rt { color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.pos { color: var(--lime); } .hi { color: var(--hi); } .neg { color: var(--neg); } .zero { color: var(--muted); }
.empty { padding: 22px 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }

.cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding-top: 34px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, rgba(17, 17, 18, 0), var(--bg) 46%);
}
.cta button {
  pointer-events: auto; width: 100%; height: 58px; border: 0; border-radius: 29px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--tier); color: var(--on-tier); font-weight: 700; font-size: 16.5px;
}
body[data-tier="gold"] .cta button { background: linear-gradient(135deg, #F7D96B, #D9A21B); }
.cta button:active { transform: scale(.98); }

/* ---------- Punktevergabe ---------- */
.ehead {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 12;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.ehead .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 58px; gap: 8px; }
.back {
  justify-self: start; min-height: 44px; padding: 0 12px 0 4px; background: transparent; border: 0;
  font-weight: 500; font-size: 14.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px;
}
.back b { font-size: 26px; line-height: 1; font-weight: 400; }
.etitle { font-weight: 600; font-size: 15.5px; }
.chip {
  justify-self: end; min-width: 64px; text-align: center; padding: 8px 12px; border-radius: 18px;
  border: 2px solid var(--tier); font: 700 14px/1 var(--font-display); font-variant-numeric: tabular-nums;
}
.eb { padding-block: 4px 200px; }
.eb h2 {
  display: flex; align-items: center; gap: 10px; margin: 22px 0 10px;
  font: 600 11.5px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  text-wrap: balance;
}
.eb h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.note { margin: -4px 0 10px; font-size: 12.5px; color: var(--muted); max-width: 60ch; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 339px) { .grid { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.act {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px;
  min-height: 66px; padding: 10px 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  font-weight: 400; font-size: 13.5px; line-height: 1.25; user-select: none; -webkit-user-select: none;
}
.act:active { transform: scale(.97); background: var(--raised); }
.act.on { border-color: rgba(var(--tier-rgb), .85); }
.act.hit { animation: hit .55s ease-out; }
@keyframes hit { 0% { background: rgba(var(--tier-rgb), .5); } 100% { background: var(--surface); } }
.lb { min-width: 0; overflow-wrap: anywhere; }
.pt { font: 700 14.5px/1 var(--font-display); font-variant-numeric: tabular-nums; padding: 7px 8px; border-radius: 8px; }
.pt.pos { background: var(--lime-bg); } .pt.hi { background: var(--hi-bg); } .pt.neg { background: var(--neg-bg); } .pt.zero { background: var(--raised); }
.cnt {
  position: absolute; top: -8px; left: -6px; min-width: 24px; height: 24px; padding: 0 7px;
  display: grid; place-items: center; border-radius: 12px;
  background: var(--tier); color: var(--on-tier); font-weight: 700; font-size: 12.5px;
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.big-clk { font: 700 48px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.big-clk small { font: 500 13px var(--font-body); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.row2 { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.btn {
  min-height: 48px; padding: 8px 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--raised); font-weight: 600; font-size: 14px;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--tier); border-color: var(--tier); color: var(--on-tier); }
.btn.danger { background: transparent; color: var(--neg); border-color: rgba(255, 90, 42, .5); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: var(--raised); padding: 10px 20px; min-height: 48px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--tier); color: var(--on-tier); }
.scoreline { font: 700 38px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.scorecap { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.auto { margin: 0; padding: 0; list-style: none; }
.auto li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.auto li:last-child { border-bottom: 0; }
.auto small { display: block; color: var(--muted); font-size: 12px; }
.auto .v { font: 700 15px/1.4 var(--font-display); font-variant-numeric: tabular-nums; }
.hint { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; max-width: 60ch; }
.log { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.log li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 44px; align-items: center; gap: 8px; padding: 4px 4px 4px 14px; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.log .mn { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.log .p { font: 700 15px var(--font-display); font-variant-numeric: tabular-nums; }
.log .x { width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; }
.log .none { display: block; padding: 18px 14px; color: var(--muted); }
textarea#sum {
  width: 100%; min-height: 200px; resize: vertical; padding: 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.undo { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 14; background: var(--raised); border-top: 1px solid var(--line); }
.undo .wrap { display: flex; align-items: center; gap: 12px; min-height: 50px; }
.undo .tx { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.undo .tx b { margin-left: 8px; font: 700 14px var(--font-display); }
.undo button { min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-inline: max(4px, env(safe-area-inset-left, 0px)) max(4px, env(safe-area-inset-right, 0px)); }
.tabs button {
  height: 60px; background: transparent; border: 0; border-top: 3px solid transparent;
  font-weight: 600; font-size: 12.5px; color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-top-color: var(--tier); }
@media (prefers-reduced-motion: reduce) { .act.hit { animation: none; } }
</style>

    })(t0);
  }
  function applyTier(t) { document.body.setAttribute('data-tier', tierOf(t)); }

  /* ---------- Hauptseite ---------- */
  function stateText() {
    if (S.ended) return 'Endstand';
    if (!started()) return 'Anstoß';
    var m = Math.floor(elapsed() / 60) + 1;
    return (S.clock.startedAt ? 'Live ' : 'Pause ') + m + '’';
  }
  function rowsData() {
    var out = [];
    endLines().forEach(function (l) { out.push({ p: l.p, label: l.l, r: l.r }); });
    S.events.slice().reverse().forEach(function (e) { out.push({ p: e.pts, label: e.label, r: minStamp(e.t) }); });
    var s = startLine(); if (s) out.push({ p: s.p, label: s.l, r: s.r });
    return out;
  }
  function updateLive() {
    var el = $('hState');
    el.textContent = stateText();
    el.className = 'state' + (!S.ended && S.clock.startedAt ? ' live' : '');
  }
  function renderHome() {
    var t = total(), sc = score(), rows = rowsData();
    applyTier(t);
    setNum($('hNum'), t);
    $('hScore').textContent = sc.them + ' : ' + sc.us;
    $('rows').innerHTML = rows.length ? rows.map(function (r) {
      return '<li class="row"><span class="rp ' + cls(r.p) + '">' + fmt(r.p) + '</span><span class="rl">' + esc(r.label) +
        '</span><span class="rt">' + esc(r.r) + '</span></li>';
    }).join('') : '<li class="empty">Noch keine Punkte. Tippe unten auf „Punkte vergeben“, sobald das Spiel läuft.</li>';
    homeSig = t + '|' + S.events.length + '|' + S.ended;
    updateLive();
  }

  /* ---------- Punktevergabe ---------- */
  function actBtn(key) {
    var a = ACT[key], p = val(a), c = count(key);
    return '<button type="button" class="act' + (c ? ' on' : '') + '" data-k="' + key + '"><span class="lb">' + esc(a.l) +
      '</span><span class="pt ' + cls(p) + '">' + fmt(p) + '</span>' + (c ? '<span class="cnt">' + c + '</span>' : '') + '</button>';
  }
  function groupsHtml(k) {
    return G[k].map(function (g) {
      return '<h2>' + esc(g.t) + '</h2>' + (g.n ? '<p class="note">' + esc(g.n) + '</p>' : '') +
        '<div class="grid">' + g.a.map(function (x) { return actBtn(x[0]); }).join('') + '</div>';
    }).join('');
  }
  function autoHtml() {
    var ls = [], s = startLine();
    if (s) ls.push(s);
    ls = ls.concat(endLines());
    var html = ls.length ? '<ul class="auto">' + ls.map(function (l) {
      return '<li><span>' + esc(l.l) + (l.h ? '<small>' + esc(l.h) + '</small>' : '') + '</span><span class="v ' + cls(l.p) + '">' + fmt(l.p) + '</span></li>';
    }).join('') + '</ul>' : '<p class="hint" style="margin:0">Noch keine Einsatzzeit. Sobald die Spieluhr läuft, zählt die Startelf.</p>';
    if (!S.ended) html += '<p class="hint">Minutenbonus, „Zu null“ und Sieg/Niederlage kommen erst nach „Spiel beenden“ dazu.</p>';
    return html;
  }
  function spielHtml() {
    var running = !!S.clock.startedAt, sc = score(), on = onField(), d = S.ended ? ' disabled' : '';
    return '' +
      '<h2>Spieluhr</h2>' +
      '<div class="card"><div class="big-clk"><span id="clk">' + clock(elapsed()) + '</span><small>Min.</small></div>' +
      '<div class="row2">' +
        '<button type="button" class="btn primary" data-do="clock"' + d + '>' + (running ? 'Pause' : 'Start') + '</button>' +
        '<button type="button" class="btn" data-do="m-1"' + d + '>-1 Min</button>' +
        '<button type="button" class="btn" data-do="m+1"' + d + '>+1 Min</button>' +
        '<button type="button" class="btn" data-do="half2"' + d + '>2. Halbzeit ab 45:00</button>' +
      '</div></div>' +
      '<h2>Spielstand</h2>' +
      '<div class="scoreline">' + sc.them + ' : ' + sc.us + '</div>' +
      '<div class="scorecap">' + esc(OPP) + ' : ' + esc(TEAM) + '</div>' +
      '<div class="grid">' + actBtn('tg') + actBtn('cg') + '</div>' +
      '<p class="hint">Team-Tor (+5) und Gegentor (-5) zählen nur, solange ' + esc(PLAYER) + ' auf dem Platz steht. Draußen zählt nur der Spielstand.</p>' +
      '<h2>Einsatz</h2>' +
      '<div class="card"><div class="row2" style="margin-top:0;align-items:center">' +
        '<div class="seg" role="group" aria-label="Start"><button type="button" data-do="start1" aria-pressed="' + S.startelf + '">Startelf</button><button type="button" data-do="start0" aria-pressed="' + !S.startelf + '">Bank</button></div>' +
        '<button type="button" class="btn" data-do="field"' + d + '>' + (on ? 'Auswechseln' : 'Einwechseln') + '</button>' +
      '</div><p class="hint">Startelf oder Bank vor dem Anpfiff wählen. Die Spielzeit läuft nur, solange er auf dem Platz steht.</p>' +
      '<div style="margin-top:14px"><div class="seg" role="group" aria-label="Position"><button type="button" data-do="pABW" aria-pressed="' + (S.pos === 'ABW') + '">Abwehr</button><button type="button" data-do="pMIT" aria-pressed="' + (S.pos === 'MIT') + '">Mittelfeld</button></div></div></div>' +
      '<h2>Automatische Punkte</h2>' +
      '<div class="card" id="autoBox">' + autoHtml() + '</div>' +
      '<h2>Spielende</h2>' +
      '<div class="row2" style="margin-top:0">' +
        (S.ended
          ? '<button type="button" class="btn" data-do="reopen">Spiel wieder öffnen</button>'
          : '<button type="button" class="btn primary" data-do="end">Spiel beenden</button>') +
        (confirmReset
          ? '<button type="button" class="btn danger" data-do="reset-yes">Ja, alles löschen</button><button type="button" class="btn" data-do="reset-no">Abbrechen</button>'
          : '<button type="button" class="btn danger" data-do="reset">Neues Spiel</button>') +
      '</div>' +
      '<p class="hint">Alles bleibt auf diesem Gerät gespeichert, auch wenn die Seite neu lädt.</p>';
  }
  function summary() {
    var sc = score(), order = [], agg = {};
    S.events.forEach(function (e) {
      if (!agg[e.key]) { agg[e.key] = { l: e.label, n: 0, p: 0 }; order.push(e.key); }
      agg[e.key].n++; agg[e.key].p += e.pts;
    });
    var ls = [], s = startLine(); if (s) ls.push(s); ls = ls.concat(endLines());
    var out = [];
    out.push(PLAYER + ' (' + (S.pos === 'ABW' ? 'Abwehr' : 'Mittelfeld') + ') – ' + TEAM);
    out.push('Gesamt: ' + total() + ' Punkte');
    out.push(OPP + ' ' + sc.them + ':' + sc.us + ' ' + TEAM + ', Spielzeit ' + minPlayed() + ' Min.' + (S.ended ? '' : ' (Spiel läuft)'));
    out.push('');
    if (ls.length) { out.push('Automatisch'); ls.forEach(function (l) { out.push('  ' + l.l + ': ' + fmt(l.p)); }); out.push(''); }
    out.push('Aktionen');
    if (!order.length) out.push('  noch keine');
    order.forEach(function (k) { var g = agg[k]; out.push('  ' + g.n + 'x ' + g.l + ': ' + fmt(g.p)); });
    return out.join('\n');
  }
  function logHtml() {
    var items = S.events.slice().reverse().map(function (e) {
      return '<li><span class="mn">' + minStamp(e.t) + '</span><span>' + esc(e.label) + '</span><span class="p ' + cls(e.pts) + '">' + fmt(e.pts) + '</span>' +
        '<button type="button" class="x" data-del="' + e.id + '" aria-label="' + esc(e.label) + ' löschen">×</button></li>';
    }).join('');
    return '<h2>Alle Aktionen (' + S.events.length + ')</h2>' +
      (items ? '<ul class="log">' + items + '</ul>' : '<ul class="log"><li><span class="none">Noch nichts gebucht. Tippe in Angriff, Abwehr oder Fehler auf eine Aktion.</span></li></ul>') +
      '<h2>Zusammenfassung</h2>' +
      '<textarea id="sum" readonly aria-label="Zusammenfassung">' + esc(summary()) + '</textarea>' +
      '<div class="row2"><button type="button" class="btn primary" data-do="copy" id="copyBtn">Kopieren</button></div>';
  }
  var main = $('editBody');
  function renderEdit() {
    if (tab === 'spiel') main.innerHTML = spielHtml();
    else if (tab === 'log') main.innerHTML = logHtml();
    else main.innerHTML = groupsHtml(tab);
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    refreshEdit();
  }
  function refreshEdit() {
    var t = total();
    applyTier(t);
    setNum($('eTot'), t);
    var u = $('undo'), last = S.events[S.events.length - 1];
    if (last) {
      u.hidden = false;
      $('undoTx').innerHTML = esc(minStamp(last.t) + ' ' + last.label) + '<b class="' + cls(last.pts) + '">' + fmt(last.pts) + '</b>';
    } else u.hidden = true;
  }
  function tick() {
    if (view === 'home') {
      updateLive();
      var sig = total() + '|' + S.events.length + '|' + S.ended;
      if (sig !== homeSig) renderHome();
    } else {
      var c = $('clk'); if (c) c.textContent = clock(elapsed());
      var ab = $('autoBox'); if (ab) ab.innerHTML = autoHtml();
      setNum($('eTot'), total());
    }
  }
  function show(v) {
    view = v;
    $('home').hidden = v !== 'home'; $('cta').hidden = v !== 'home'; $('edit').hidden = v !== 'edit';
    confirmReset = false;
    if (v === 'home') renderHome(); else renderEdit();
    window.scrollTo(0, 0);
  }

  /* ---------- Aktionen ---------- */
  function addEvent(key) {
    var a = ACT[key]; if (!a) return;
    var live = S.clock.startedAt !== null || S.clock.offset > 0;
    S.events.push({ id: S.nextId++, key: key, label: a.s || a.l, pts: val(a), t: live ? Math.floor(elapsed()) : -1 });
    save(); buzz();
    if (tab === 'spiel') { renderEdit(); return; }
    main.querySelectorAll('[data-k="' + key + '"]').forEach(function (el) { el.outerHTML = actBtn(key); });
    main.querySelectorAll('[data-k="' + key + '"]').forEach(function (el) { el.classList.add('hit'); });
    refreshEdit();
  }
  function setField(on) {
    var el = elapsed(), l = S.stints[S.stints.length - 1];
    if (on) { if (!l || l.to !== null) S.stints.push({ from: el, to: null }); }
    else if (l && l.to === null) l.to = el;
  }
  function setClock(sec, run) { S.clock.offset = Math.max(0, sec); S.clock.startedAt = run ? Date.now() : null; }
  function doAct(what) {
    var el = elapsed(), running = !!S.clock.startedAt;
    switch (what) {
      case 'clock': if (S.ended) return; setClock(el, !running); break;
      case 'm-1': setClock(el - 60, running); break;
      case 'm+1': setClock(el + 60, running); break;
      case 'half2': setClock(Math.max(el, 45 * 60), false); break;
      case 'start1': S.startelf = true; if (!started()) S.stints = [{ from: 0, to: null }]; break;
      case 'start0': S.startelf = false; if (!started()) S.stints = []; break;
      case 'field': setField(!onField()); break;
      case 'end': setClock(el, false); setField(false); S.ended = true; break;
      case 'reopen': S.ended = false; break;
      case 'reset': confirmReset = true; renderEdit(); return;
      case 'reset-no': confirmReset = false; renderEdit(); return;
      case 'reset-yes': S = fresh({ pos: S.pos }); confirmReset = false; break;
      case 'pABW': S.pos = 'ABW'; break;
      case 'pMIT': S.pos = 'MIT'; break;
      case 'undo': S.events.pop(); break;
      case 'copy': return copySummary();
    }
    save(); renderEdit();
  }
  function copySummary() {
    var ta = $('sum'), btn = $('copyBtn'), txt = ta.value;
    function done(msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = 'Kopieren'; }, 2000); }
    function fallback() { ta.focus(); ta.select(); try { done(document.execCommand('copy') ? 'Kopiert' : 'Markiert, bitte kopieren'); } catch (e) { done('Markiert, bitte kopieren'); } }
    try { navigator.clipboard.writeText(txt).then(function () { done('Kopiert'); }, fallback); } catch (e) { fallback(); }
  }

  /* ---------- Eingaben ---------- */
  document.addEventListener('click', function (e) {
    var n = e.target.closest('[data-nav]');
    if (n) show(n.getAttribute('data-nav'));
  });
  main.addEventListener('click', function (e) {
    var b = e.target.closest('[data-k],[data-do],[data-del]'); if (!b) return;
    if (b.hasAttribute('data-k')) addEvent(b.getAttribute('data-k'));
    else if (b.hasAttribute('data-do')) doAct(b.getAttribute('data-do'));
    else { var id = +b.getAttribute('data-del'); S.events = S.events.filter(function (x) { return x.id !== id; }); save(); renderEdit(); }
  });
  $('undo').addEventListener('click', function (e) { if (e.target.closest('[data-do="undo"]')) doAct('undo'); });
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    tab = b.getAttribute('data-tab'); confirmReset = false; renderEdit(); window.scrollTo(0, 0);
  });

  show('home');
  setInterval(tick, 1000);
})();
</script>

</body></html>
