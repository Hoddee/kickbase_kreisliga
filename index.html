<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Matchday Punkte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#111112">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@125,600;125,700;125,800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Hauptseite wie die Kickbase-Spielerkarte (Punktemuster, Foto, große Punktzahl, Wappen, Liste je Aktion) mit einem Button unten.
   Zweite Ansicht ist die Punktevergabe mit Reitern unten. Die Stufenfarbe der Gesamtpunkte färbt nur den LIVE-Text, den Button und kleine Marker. */
:root {
  color-scheme: dark;
  --bg: #111112;
  --surface: #181A1C;
  --raised: #222528;
  --line: #2C2F33;
  --ink: #F4F5F6;
  --muted: #8E9399;
  --lime: #9CE04A;
  --hi: #2FD673;
  --neg: #FF5A2A;
  --lime-bg: rgba(156, 224, 74, .14);
  --hi-bg: rgba(47, 214, 115, .15);
  --neg-bg: rgba(255, 90, 42, .15);
  --tier: #F28C1B;
  --tier-rgb: 242, 140, 27;
  --on-tier: #1A1000;
  --tier-text: #F28C1B;
  --font-display: 'Saira', 'Arial', system-ui, sans-serif;
  --font-body: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* Stufen: Minus dunkelrot, 0-99 orange, 100-199 hellgrün, 200-399 dunkelgrün, ab 400 gold */
body[data-tier="red"]     { --tier: #B3202A; --tier-rgb: 179, 32, 42;  --on-tier: #FFFFFF; --tier-text: #E0343F; }
body[data-tier="orange"]  { --tier: #ED8928; --tier-rgb: 237, 137, 40; --on-tier: #1A1000; --tier-text: #ED8928; }
body[data-tier="lime"]    { --tier: #9CE04A; --tier-rgb: 156, 224, 74; --on-tier: #0F1C06; --tier-text: #9CE04A; }
body[data-tier="emerald"] { --tier: #28DE86; --tier-rgb: 40, 222, 134; --on-tier: #03170C; --tier-text: #28DE86; }
body[data-tier="gold"]    { --tier: #E1BE38; --tier-rgb: 225, 190, 56; --on-tier: #1F1600; --tier-text: #E1BE38; }

* { box-sizing: border-box; }
html { overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14.5px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
.wrap {
  width: 100%; max-width: 560px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--tier); outline-offset: 2px; }

/* ---------- Hauptseite ---------- */
.hero {
  --pw: clamp(240px, min(90vw, 40svh), 420px);
  position: relative; isolation: isolate; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background-image: radial-gradient(circle, rgba(255, 255, 255, .36) 2px, transparent 2.5px);
  background-size: 26px 26px; background-position: center top;
  -webkit-mask-image: linear-gradient(#000 0%, #000 42%, transparent 82%);
  mask-image: linear-gradient(#000 0%, #000 42%, transparent 82%);
}
.hero::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60%; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(17, 17, 18, 0), rgba(17, 17, 18, .8) 60%, var(--bg) 100%);
}
.hero-in { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.photo {
  position: relative; z-index: 1; width: var(--pw); aspect-ratio: 907 / 1255;
  -webkit-mask-image: linear-gradient(#000 72%, transparent 100%);
  mask-image: linear-gradient(#000 72%, transparent 100%);
}
.photo img { display: block; width: 100%; height: 100%; object-fit: contain; }
.hero-text {
  position: relative; z-index: 2; width: 100%; text-align: center;
  margin-top: calc(var(--pw) * -.46); padding-bottom: 22px;
}
.pname { font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .85); min-height: 26px; text-shadow: 0 2px 10px rgba(0, 0, 0, .75); }
.num {
  text-shadow: 0 4px 24px rgba(0, 0, 0, .45);
  font: 800 clamp(84px, 28vw, 124px)/1.05 var(--font-display); letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; margin: 4px 0 10px; color: rgba(255, 255, 255, .94);
}
.num[data-len="4"] { font-size: clamp(60px, 19vw, 86px); }
.num[data-len="5"] { font-size: clamp(50px, 15vw, 70px); }
.match { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; max-width: 320px; margin: 0 auto; }
.badge {
  justify-self: center;
  display: grid; place-items: center;
}
.badge img { width: clamp(64px, 22vw, 88px); height: clamp(64px, 22vw, 88px); object-fit: contain; display: block; }
.mid { text-align: center; min-width: 96px; }
.sc { font: 500 32px/1.1 var(--font-body); letter-spacing: .08em; color: rgba(255, 255, 255, .86); font-variant-numeric: tabular-nums; }
.state { margin-top: 3px; font-weight: 600; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.state.live { color: var(--tier); }

.rows-wrap { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
.rows { list-style: none; margin: 0; padding: 6px 0 0; }
.row {
  display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; gap: 6px;
  padding: 14px 16px 14px 14px; margin-bottom: 8px;
  border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, .02);
}
.rp { font: 700 18px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.rl { min-width: 0; font-size: 15.5px; font-weight: 400; overflow-wrap: anywhere; }
.rt { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pos { color: var(--lime); } .hi { color: var(--hi); } .neg { color: var(--neg); } .zero { color: var(--muted); }
.empty { padding: 22px 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }

.cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.cta .wrap { display: flex; justify-content: flex-end; }
.cta button {
  pointer-events: auto; height: 46px; padding: 0 18px 0 14px; border: 0; border-radius: 23px;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--tier); color: var(--on-tier); font-weight: 700; font-size: 14px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .5);
}
.cta .ic { font-size: 20px; line-height: 1; font-weight: 600; }
body[data-tier="gold"] .cta button { background: linear-gradient(135deg, #F7D96B, #D9A21B); }
.cta button:active { transform: scale(.98); }

/* ---------- Endübersicht ---------- */
.ended .num { color: var(--tier-text); }
body[data-tier="gold"].ended .num {
  background: linear-gradient(135deg, #F7D96B, #D9A21B); -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.sec {
  display: flex; align-items: center; gap: 10px; margin: 22px 0 10px;
  font: 600 11.5px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.lh { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 18px; }
.lh b { font: 700 24px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.lh span { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.chart { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.chart::-webkit-scrollbar { display: none; }
.col { flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.col[data-tier="red"]     { --c: #B3202A; --ct: #E0343F; }
.col[data-tier="orange"]  { --c: #ED8928; --ct: #ED8928; }
.col[data-tier="lime"]    { --c: #9CE04A; --ct: #9CE04A; }
.col[data-tier="emerald"] { --c: #28DE86; --ct: #28DE86; }
.col[data-tier="gold"]    { --c: #E1BE38; --ct: #E1BE38; }
.ci { height: 18px; font: 500 15px/1 var(--font-body); color: var(--muted); }
.col.cur .ci { color: var(--ink); }
.cc { display: flex; align-items: center; gap: 4px; height: 22px; margin: 12px 0 8px; }
.cc img { width: 22px; height: 22px; object-fit: contain; display: block; }
.cs { margin-bottom: 14px; font: 500 14px/1 var(--font-body); letter-spacing: .1em; color: rgba(255, 255, 255, .85); font-variant-numeric: tabular-nums; }
.trk2 { position: relative; display: flex; align-items: flex-end; width: 30px; height: 250px; border-radius: 6px; background: rgba(255, 255, 255, .05); overflow: hidden; }
.fill { position: relative; width: 100%; min-height: 6px; border-radius: 6px; background: var(--c); }
.ico { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; color: rgba(255, 255, 255, .92); }
.ico svg { display: block; width: 20px; height: 20px; }
.cv { margin-top: 14px; font: 700 23px/1 var(--font-display); color: var(--ct); font-variant-numeric: tabular-nums; }
.cm { margin-top: 6px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.bt { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13.5px; }
.bt span { min-width: 0; color: var(--ink); }
.bt b { font: 700 15px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.trk { height: 8px; margin-top: 8px; border-radius: 4px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.trk i { display: block; height: 100%; border-radius: 4px; background: currentColor; }

/* ---------- Punktevergabe ---------- */
.ehead {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 12;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.ehead .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 58px; gap: 8px; }
.back {
  justify-self: start; min-height: 44px; padding: 0 12px 0 4px; background: transparent; border: 0;
  font-weight: 500; font-size: 14.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px;
}
.back b { font-size: 26px; line-height: 1; font-weight: 400; }
.etitle { font-weight: 600; font-size: 15.5px; }
.chip {
  justify-self: end; min-width: 64px; text-align: center; padding: 8px 12px; border-radius: 18px;
  border: 2px solid var(--tier); font: 700 14px/1 var(--font-display); font-variant-numeric: tabular-nums;
}
.eb { padding-block: 4px 200px; }
.eb h2 {
  display: flex; align-items: center; gap: 10px; margin: 22px 0 10px;
  font: 600 11.5px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  text-wrap: balance;
}
.eb h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 339px) { .grid { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.act {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px;
  min-height: 66px; padding: 10px 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  font-weight: 400; font-size: 13.5px; line-height: 1.25; user-select: none; -webkit-user-select: none;
}
.grid.big .act { min-height: 84px; padding: 12px 10px 12px 12px; gap: 6px; font-size: 13px; font-weight: 600; }
.grid.big .lb, .grid .lb { overflow-wrap: break-word; hyphens: auto; }
.grid.big .pt { font-size: 15px; padding: 7px 7px; }
.grid.chips { gap: 6px; }
.chips .act { min-height: 44px; padding: 6px 8px 6px 11px; gap: 6px; font-size: 12.5px; line-height: 1.2; border-radius: 10px; }
.chips .pt { font-size: 12.5px; padding: 5px 7px; }
.chips .cnt { top: -9px; left: auto; right: -5px; min-width: 20px; height: 20px; font-size: 11.5px; }
.act:active { transform: scale(.97); background: var(--raised); }
.act.on { border-color: rgba(var(--tier-rgb), .85); }
.act.hit { animation: hit .55s ease-out; }
@keyframes hit { 0% { background: rgba(var(--tier-rgb), .5); } 100% { background: var(--surface); } }
.lb { min-width: 0; overflow-wrap: anywhere; }
.pt { font: 700 14.5px/1 var(--font-display); font-variant-numeric: tabular-nums; padding: 7px 8px; border-radius: 8px; }
.pt.pos { background: var(--lime-bg); } .pt.hi { background: var(--hi-bg); } .pt.neg { background: var(--neg-bg); } .pt.zero { background: var(--raised); }
.cnt {
  position: absolute; top: -8px; left: -6px; min-width: 24px; height: 24px; padding: 0 7px;
  display: grid; place-items: center; border-radius: 12px;
  background: var(--tier); color: var(--on-tier); font-weight: 700; font-size: 12.5px;
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.big-clk { font: 700 48px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.big-clk small { font: 500 13px var(--font-body); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.row2 { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.btn {
  min-height: 48px; padding: 8px 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--raised); font-weight: 600; font-size: 14px;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--tier); border-color: var(--tier); color: var(--on-tier); }
.btn.danger { background: transparent; color: var(--neg); border-color: rgba(255, 90, 42, .5); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: var(--raised); padding: 10px 20px; min-height: 48px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--tier); color: var(--on-tier); }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; padding: 10px 4px; font-size: 13px; min-width: 0; }
.sb .sh { margin-top: 26px; }
.grp { display: flex; align-items: center; gap: 8px; margin: 14px 0 10px; font-size: 13px; color: var(--muted); }
.grp img { width: 22px; height: 22px; object-fit: contain; }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ptile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; font-weight: 600; min-width: 0; }
.ptile .av { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; background: var(--raised); }
.ptile .av img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; display: block; }
.ptile[aria-pressed="true"], .otile[aria-pressed="true"] { border-color: var(--tier); box-shadow: 0 0 0 1px var(--tier) inset; }
.ogrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.otile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 11.5px; line-height: 1.2; text-align: center; min-width: 0; }
.otile img { width: 52px; height: 52px; object-fit: contain; }
.otile span { overflow-wrap: anywhere; }
.go { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, rgba(17,17,18,0), var(--bg) 40%); }
.go button { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--tier); color: var(--on-tier); font-weight: 700; font-size: 16px; }
.go button[disabled] { background: var(--raised); color: var(--muted); }
.scoreline { font: 700 38px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.auto { margin: 0; padding: 0; list-style: none; }
.auto li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.auto li:last-child { border-bottom: 0; }
.auto small { display: block; color: var(--muted); font-size: 12px; }
.auto .v { font: 700 15px/1.4 var(--font-display); font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.log li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 44px; align-items: center; gap: 8px; padding: 4px 4px 4px 14px; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.log .mn { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.log .p { font: 700 15px var(--font-display); font-variant-numeric: tabular-nums; }
.log .x { width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; }
.log .none { display: block; padding: 18px 14px; color: var(--muted); }
textarea#sum {
  width: 100%; min-height: 200px; resize: vertical; padding: 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.undo { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 14; background: var(--raised); border-top: 1px solid var(--line); }
.undo .wrap { display: flex; align-items: center; gap: 12px; min-height: 50px; }
.undo .tx { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.undo .tx b { margin-left: 8px; font: 700 14px var(--font-display); }
.undo button { min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-inline: max(4px, env(safe-area-inset-left, 0px)) max(4px, env(safe-area-inset-right, 0px)); }
.tabs button {
  height: 60px; background: transparent; border: 0; border-top: 3px solid transparent;
  font-weight: 600; font-size: 12.5px; color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-top-color: var(--tier); }
.num, .rp, .pt, .chip, .big-clk, .scoreline, .auto .v, .log .p, .undo .tx b, .cv, .bt b { font-stretch: 125%; }
@media (prefers-reduced-motion: reduce) { .act.hit { animation: none; } }
.eb h2 { margin: 30px 0 12px; }
.act { min-height: 62px; }
.chips .act { min-height: 50px; }
.fl { margin: 16px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fl:first-child { margin-top: 0; }
.btn.big { width: 100%; min-height: 58px; margin-top: 16px; font-size: 17px; border-radius: 14px; }
.btn.full { width: 100%; }
.trio { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 8px; margin-top: 10px; }
.trio .btn { padding: 8px 6px; min-height: 50px; font-size: 13.5px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.big-clk { text-align: center; font-size: 60px; padding: 4px 0 2px; }
.scorebox { text-align: center; font: 700 52px/1 var(--font-display); font-stretch: 125%; font-variant-numeric: tabular-nums; margin: 4px 0 16px; letter-spacing: .04em; }
.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 66px; font-size: 12px; }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  document.querySelector('.tabs').addEventListener('click', function (e) {

    tab = b.getAttribute('data-tab'); confirmReset = false; confirmEnd = false; confirmHist = false; renderEdit(); window.scrollTo(0, 0);
  });

  /* Bildschirm bleibt an, kurzes Vibrieren bei jedem Tipp auf eine Aktion */
  var wl = null;
  function keepAwake() {
    try {
      if (navigator.wakeLock && document.visibilityState === 'visible' && !wl) {
        navigator.wakeLock.request('screen').then(function (l) { wl = l; l.addEventListener('release', function () { wl = null; }); }).catch(function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', function (e) {
    keepAwake();
    try { if (navigator.vibrate && e.target.closest && e.target.closest('.act')) navigator.vibrate(12); } catch (x) {}
  });

  show('home');
  setInterval(tick, 1000);
})();
</script>

</body></html>
