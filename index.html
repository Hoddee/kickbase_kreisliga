<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kreisliga Edition</title>
<meta name="description" content="Kickbase-Punkte für die Kreisliga: live buchen, Hall of Fame, Marktwerte.">
<meta name="theme-color" content="#131417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kreisliga">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://eewvsquscmflxdhkgvna.supabase.co" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/booking.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/admin.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<!-- Spielerkarte (Live / Endstand) -->
<div id="home" hidden>
  <section class="hero">
    <div class="wrap hero-in">
      <div class="photo"><img id="hPhoto" src="" alt="" width="907" height="1255"></div>
      <div class="hero-text">
        <div class="pname" id="hName"></div>
        <div class="num" id="hNum" data-len="1">0</div>
        <div class="match">
          <div class="badge"><img id="hBL" src="" alt=""></div>
          <div class="mid"><div class="sc" id="hScore">0 : 0</div><div class="state" id="hState">Anstoß</div></div>
          <div class="badge"><img id="hBR" src="" alt=""></div>
        </div>
        <div class="note-badge hero-badge" id="hBadge" hidden>Nachtrag</div>
      </div>
    </div>
  </section>
  <main class="wrap"><div id="summary"></div><div class="rows-wrap"><h2 class="sec" id="listH" hidden>Alle Punkte</h2><ul class="rows" id="rows"></ul></div></main>
</div>

<div class="cta" id="cta" hidden><div class="wrap"><button type="button" data-nav="edit"><span class="ic" id="ctaI" aria-hidden="true">+</span><span id="ctaL">Punkte vergeben</span></button></div></div>

<!-- Spiel einrichten -->
<section id="setup" hidden>
  <header class="ehead">
    <div class="wrap">
      <div class="brand"><svg viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="#ff4600"/><circle cx="15" cy="15" r="7.2" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M15 3v24M3 15h4.8M22.2 15H27" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg><b>KREISLIGA</b><i>EDITION</i></div>
      <div class="hdr-actions">
        <button type="button" class="hofbtn" data-nav="hof"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8M10 17h4"/></svg>Hall of Fame</button>
        <button type="button" class="iconbtn" id="adminBtn" data-nav="admin" aria-label="Admin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
      </div>
    </div>
  </header>
  <main class="wrap eb sb" id="setupBody"></main>
  <div class="go"><div class="wrap"><button type="button" id="goBtn" data-pick="go" disabled>Spiel starten</button></div></div>
</section>

<!-- Hall of Fame -->
<section id="hof" hidden>
  <header class="ehead">
    <div class="wrap">
      <button type="button" class="back" data-nav="back" aria-label="Zurück"><b aria-hidden="true">‹</b>Zurück</button>
      <div class="etitle">Hall of Fame</div>
      <button type="button" class="rf" data-hof="reload" aria-label="Aktualisieren">↻</button>
    </div>
  </header>
  <main class="wrap eb hb" id="hofBody"></main>
</section>

<!-- Admin -->
<section id="admin" hidden>
  <header class="ehead">
    <div class="wrap">
      <button type="button" class="back" data-nav="setup" aria-label="Zurück"><b aria-hidden="true">‹</b>Zurück</button>
      <div class="etitle">Admin</div>
      <span></span>
    </div>
  </header>
  <main class="wrap eb hb" id="adminBody"></main>
</section>

<!-- Punktevergabe -->
<section id="edit" hidden>
  <header class="ehead">
    <div class="wrap">
      <button type="button" class="back" data-nav="home" aria-label="Zurück zur Anzeige"><b aria-hidden="true">‹</b>Anzeige</button>
      <div class="etitle" id="etitle">Punkte vergeben</div>
      <div class="chip" id="eTot">0</div>
    </div>
  </header>
  <div class="quick" id="quick" hidden><div class="qrow" id="qrow"></div></div>
  <main class="wrap eb" id="editBody"></main>
  <div class="undo" id="undo" hidden>
    <div class="wrap">
      <div class="tx" id="undoTx"></div>
      <button type="button" data-do="undo">Rückgängig</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Bereiche">
    <div class="wrap" role="tablist">
      <button type="button" role="tab" data-tab="spiel" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="tl">Spiel</span></button>
      <button type="button" role="tab" data-tab="att" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg><span class="tl">Angriff</span></button>
      <button type="button" role="tab" data-tab="def" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span class="tl">Abwehr</span></button>
      <button type="button" role="tab" data-tab="err" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span class="tl">Fehler</span></button>
      <button type="button" role="tab" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span class="tl">Verlauf</span></button>
    </div>
  </nav>
</section>

<noscript><p style="padding:24px;color:#dee4ec;background:#131417">Bitte JavaScript aktivieren.</p></noscript>
</body>
</html>
