<!-- Startbildschirm sofort zeigen: sein CSS steht hier, die übrigen Stylesheets laden ohne das erste Bild zu blockieren
     (main.js blendet den Startbildschirm erst aus, wenn alle geladen sind) -->
<style>
html, body { background: #131417; }
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #131417; transition: opacity .35s ease; }
#splash.gone { opacity: 0; pointer-events: none; }
.spl { display: grid; justify-items: center; gap: 22px; }
.spl img { width: 132px; height: auto; animation: splpop .55s cubic-bezier(.2, .8, .2, 1) both; }
.spl-bar { width: 64px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.spl-bar span { display: block; width: 40%; height: 100%; background: #f0f3f7; animation: splbar 1s ease-in-out infinite; }
@keyframes splpop { from { transform: translateX(-14px) skewX(-8deg); opacity: 0; } }
@keyframes splbar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { .spl img, .spl-bar span { animation: none; } }
</style>

<body>
<!-- Startbildschirm, bis die App geladen ist -->
<div id="splash" aria-hidden="true"><div class="spl"><img src="assets/icons/logo.svg" alt="" width="132" height="58" fetchpriority="high"><span class="spl-bar"><span></span></span></div></div>

<!-- Spielerkarte (Live / Endstand) -->
<div id="home" hidden>
  <button type="button" class="homeback" data-nav="start" aria-label="Zur Übersicht"><b aria-hidden="true">‹</b>Übersicht</button>
  <section class="hero">
    <div class="wrap hero-in">
      <div class="photo"><img id="hPhoto" src="" alt="" width="907" height="1255"></div>
      <div class="hero-text">
        <div class="pname" id="hName"></div>
        <div class="num" id="hNum" data-len="1">0</div>
        <div class="match">
          <div class="badge"><img id="hBL" src="" alt=""></div>
          <div class="mid"><div class="sc" id="hScore">0 : 0</div><div class="state" id="hState">Anstoß</div></div>
          <div class="badge"><img id="hBR" src="" alt=""></div>
        </div>
        <div class="note-badge hero-badge" id="hBadge" hidden>Nachtrag</div>
      </div>
    </div>
  </section>
  <div class="squad flat" id="squadH" hidden></div>
  <main class="wrap"><div id="summary"></div><div class="rows-wrap"><h2 class="sec" id="listH" hidden>Alle Punkte</h2><ul class="rows" id="rows"></ul></div></main>
</div>

<div class="cta" id="cta" hidden><div class="wrap"><button type="button" data-nav="edit"><span class="ic" id="ctaI" aria-hidden="true">+</span><span id="ctaL">Punkte vergeben</span></button></div></div>

<!-- Startseite: Übersicht -->
<section id="start" hidden>
  <header class="ehead thead">
    <div class="wrap">
      <img class="kl-logo" src="assets/icons/logo.svg" alt="Kickbase KL" width="54" height="24">
      <div class="etitle">Liga</div>
      <span class="tseason" id="startSeason"></span>
    </div>
  </header>
  <main class="wrap eb sb" id="startBody"></main>
</section>

<!-- Kader -->
<section id="kader" hidden>
  <header class="ehead thead">
    <div class="wrap">
      <img class="kl-logo" src="assets/icons/logo.svg" alt="" width="54" height="24">
      <div class="etitle">Kader</div>
      <span></span>
    </div>
  </header>
  <main class="wrap eb sb" id="kaderBody"></main>
</section>

<!-- Spielerprofil (Blatt von unten) -->
<section id="profile" class="bsheet" hidden>
  <div class="sh-panel">
    <div class="sh-grab" aria-hidden="true"><i></i></div>
    <button type="button" class="sh-back" id="profileBack" hidden><b aria-hidden="true">‹</b>Zurück</button>
    <div class="sh-mini" id="profileMini"></div>
    <div class="sh-scroll" id="profileScroll"><main id="profileBody" class="pb"></main></div>
    <nav class="sh-tabs" id="profileTabs" aria-label="Profil"></nav>
  </div>
</section>

<!-- Live zuschauen (Blatt) -->
<section id="watch" class="bsheet" hidden>
  <div class="sh-panel">
    <div class="sh-grab" aria-hidden="true"><i></i></div>
    <div class="sh-mini mm" id="watchMini"></div>
    <div class="sh-scroll" id="watchScroll"><main id="watchBody" class="pb"></main></div>
  </div>
</section>

<!-- Spiel-Detail (Blatt über dem Profil) -->
<section id="match" class="bsheet" hidden>
  <div class="sh-panel">
    <div class="sh-grab" aria-hidden="true"><i></i></div>
    <div class="sh-mini mm" id="matchMini"></div>
    <div class="sh-scroll" id="matchScroll"><main id="matchBody" class="pb"></main></div>
  </div>
</section>

<!-- Korrekturen eines Spiels (Blatt über dem Spiel-Detail, wie bei Kickbase) -->
<section id="corr" class="bsheet" hidden>
  <div class="sh-panel sh-low">
    <div class="sh-grab" aria-hidden="true"><i></i></div>
    <div class="sh-scroll" id="corrScroll"><main id="corrBody" class="pb"></main></div>
  </div>
</section>

<!-- MVP-Stage: Top 3 des Spieltags (Vollbild) -->
<section id="mvp" class="mvp" hidden aria-label="MVP des Spieltags"></section>

<!-- Mein Bereich (freigeschaltete Spieler) -->
<section id="me" hidden>
  <header class="ehead">
    <div class="wrap">
      <button type="button" class="back" data-nav="back" aria-label="Zurück"><b aria-hidden="true">‹</b>Zurück</button>
      <div class="etitle">Mein Bereich</div>
      <span></span>
    </div>
  </header>
  <main class="wrap eb meb" id="meBody"></main>
</section>

<!-- Neues Spiel einrichten -->
<section id="setup" hidden>
  <header class="ehead">
    <div class="wrap">
      <button type="button" class="back" data-nav="start" aria-label="Zur Übersicht"><b aria-hidden="true">‹</b>Übersicht</button>
      <div class="etitle">Neues Spiel</div>
      <span></span>
    </div>
  </header>
  <main class="wrap eb sb" id="setupBody"></main>
  <div class="go"><div class="wrap"><button type="button" id="goBtn" data-pick="go" disabled>Spiel starten</button></div></div>
</section>

<!-- Hall of Fame -->
<section id="hof" hidden>
  <header class="ehead">
    <div class="wrap">
      <button type="button" class="back" data-nav="back" aria-label="Zurück"><b aria-hidden="true">‹</b>Zurück</button>
      <div class="etitle">Hall of Fame</div>
      <button type="button" class="rf" data-hof="reload" aria-label="Aktualisieren">↻</button>
    </div>
  </header>
  <main class="wrap eb hb" id="hofBody"></main>
</section>

<!-- Admin -->
<section id="admin" hidden>
  <header class="ehead">
    <div class="wrap">
      <button type="button" class="back" data-nav="start" aria-label="Zurück"><b aria-hidden="true">‹</b>Zurück</button>
      <div class="etitle" id="admTitle">Konto</div>
      <span></span>
    </div>
  </header>
  <main class="wrap eb hb" id="adminBody"></main>
</section>

<!-- Punktevergabe -->
<section id="edit" hidden>
  <header class="ehead">
    <div class="wrap">
      <button type="button" class="back" data-nav="home" aria-label="Zurück zur Anzeige"><b aria-hidden="true">‹</b>Anzeige</button>
      <div class="etitle" id="etitle">Punkte vergeben</div>
      <div class="chip" id="eTot">0</div>
    </div>
  </header>
  <div class="squad" id="squadE" hidden></div>
  <div class="quick" id="quick" hidden><div class="qrow" id="qrow"></div></div>
  <main class="wrap eb" id="editBody"></main>
  <div class="undo" id="undo" hidden>
    <div class="rbm" id="rbMenu" hidden></div>
    <div class="wrap">
      <div class="rbs" id="undoTx"></div>
      <button type="button" class="rbu" data-do="undo" aria-label="Letzte Buchung rückgängig"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    </div>
  </div>
  <nav class="tabs" aria-label="Bereiche">
    <div class="wrap" role="tablist">
      <button type="button" role="tab" data-tab="spiel" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="tl">Spiel</span></button>
      <button type="button" role="tab" data-tab="att" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg><span class="tl">Angriff</span></button>
      <button type="button" role="tab" data-tab="def" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span class="tl">Abwehr</span></button>
      <button type="button" role="tab" data-tab="err" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span class="tl">Fehler</span></button>
      <button type="button" role="tab" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span class="tl">Verlauf</span></button>
    </div>
  </nav>
</section>

<!-- Menü unten (Liga, Kader, Spiel, Hall of Fame, Ich) -->
<nav class="tabbar" id="tabbar" aria-label="Menü" hidden>
  <button type="button" data-tb="start"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/></svg><span>Liga</span></button>
  <button type="button" data-tb="kader"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v4M12 17v4"/><circle cx="12" cy="12" r="2.6"/></svg><span>Kader</span></button>
  <button type="button" data-tb="game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg><span id="tbGameL">Spiel</span><i class="tb-dot" id="tbDot" hidden></i></button>
  <button type="button" data-tb="hof"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Ranking</span></button>
  <button type="button" data-tb="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span id="tbMeL">Ich</span><i class="nbadge" id="tbBadge" hidden></i></button>
</nav>

<noscript><p style="padding:24px;color:#dee4ec;background:#131417">Bitte JavaScript aktivieren.</p></noscript>
</body>
