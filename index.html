<style>
/* Layout: Hauptseite wie die Kickbase-Spielerkarte (Punktemuster, Foto, große Punktzahl, Wappen, Liste je Aktion) mit einem Button unten.
   Zweite Ansicht ist die Punktevergabe mit Reitern unten. Die Stufenfarbe der Gesamtpunkte färbt nur den LIVE-Text, den Button und kleine Marker. */
:root {
  color-scheme: dark;
  --bg: #111112;
  --surface: #181A1C;
  --raised: #222528;
  --line: #2C2F33;
  --ink: #F4F5F6;
  --muted: #8E9399;
  --lime: #9CE04A;
  --hi: #2FD673;
  --neg: #FF5A2A;
  --lime-bg: rgba(156, 224, 74, .14);
  --hi-bg: rgba(47, 214, 115, .15);
  --neg-bg: rgba(255, 90, 42, .15);
  --tier: #F28C1B;
  --tier-rgb: 242, 140, 27;
  --on-tier: #1A1000;
  --tier-text: #F28C1B;
  --font-display: 'Saira', 'Arial', system-ui, sans-serif;
  --font-body: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* Stufen: Minus dunkelrot, 0-99 orange, 100-199 hellgrün, 200-399 dunkelgrün, ab 400 gold */
body[data-tier="red"]     { --tier: #B3202A; --tier-rgb: 179, 32, 42;  --on-tier: #FFFFFF; --tier-text: #E0343F; }
body[data-tier="orange"]  { --tier: #ED8928; --tier-rgb: 237, 137, 40; --on-tier: #1A1000; --tier-text: #ED8928; }
body[data-tier="lime"]    { --tier: #9CE04A; --tier-rgb: 156, 224, 74; --on-tier: #0F1C06; --tier-text: #9CE04A; }
body[data-tier="emerald"] { --tier: #28DE86; --tier-rgb: 40, 222, 134; --on-tier: #03170C; --tier-text: #28DE86; }
body[data-tier="gold"]    { --tier: #E1BE38; --tier-rgb: 225, 190, 56; --on-tier: #1F1600; --tier-text: #E1BE38; }

* { box-sizing: border-box; }
html { overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14.5px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
.wrap {
  width: 100%; max-width: 560px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--tier); outline-offset: 2px; }

/* ---------- Hauptseite ---------- */
.hero {
  --pw: clamp(240px, min(90vw, 40svh), 420px);
  position: relative; isolation: isolate; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background-image: radial-gradient(circle, rgba(255, 255, 255, .36) 2px, transparent 2.5px);
  background-size: 26px 26px; background-position: center top;
  -webkit-mask-image: linear-gradient(#000 0%, #000 42%, transparent 82%);
  mask-image: linear-gradient(#000 0%, #000 42%, transparent 82%);
}
.hero::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60%; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(17, 17, 18, 0), rgba(17, 17, 18, .8) 60%, var(--bg) 100%);
}
.hero-in { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.photo {
  position: relative; z-index: 1; width: var(--pw); aspect-ratio: 907 / 1255;
  -webkit-mask-image: linear-gradient(#000 72%, transparent 100%);
  mask-image: linear-gradient(#000 72%, transparent 100%);
}
.photo img { display: block; width: 100%; height: 100%; object-fit: contain; }
.hero-text {
  position: relative; z-index: 2; width: 100%; text-align: center;
  margin-top: calc(var(--pw) * -.46); padding-bottom: 22px;
}
.pname { font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .85); min-height: 26px; text-shadow: 0 2px 10px rgba(0, 0, 0, .75); }
.num {
  text-shadow: 0 4px 24px rgba(0, 0, 0, .45);
  font: 800 clamp(84px, 28vw, 124px)/1.05 var(--font-display); letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; margin: 4px 0 10px; color: rgba(255, 255, 255, .94);
}
.num[data-len="4"] { font-size: clamp(60px, 19vw, 86px); }
.num[data-len="5"] { font-size: clamp(50px, 15vw, 70px); }
.match { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; max-width: 320px; margin: 0 auto; }
.badge {
  justify-self: center;
  display: grid; place-items: center;
}
.badge img { width: clamp(64px, 22vw, 88px); height: clamp(64px, 22vw, 88px); object-fit: contain; display: block; }
.mid { text-align: center; min-width: 96px; }
.sc { font: 500 32px/1.1 var(--font-body); letter-spacing: .08em; color: rgba(255, 255, 255, .86); font-variant-numeric: tabular-nums; }
.state { margin-top: 3px; font-weight: 600; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.state.live { color: var(--tier); }

.rows-wrap { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
.rows { list-style: none; margin: 0; padding: 6px 0 0; }
.row {
  display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; gap: 6px;
  padding: 14px 16px 14px 14px; margin-bottom: 8px;
  border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, .02);
}
.rp { font: 700 18px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.rl { min-width: 0; font-size: 15.5px; font-weight: 400; overflow-wrap: anywhere; }
.rt { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pos { color: var(--lime); } .hi { color: var(--hi); } .neg { color: var(--neg); } .zero { color: var(--muted); }
.empty { padding: 22px 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }

.cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.cta .wrap { display: flex; justify-content: flex-end; }
.cta button {
  pointer-events: auto; height: 46px; padding: 0 18px 0 14px; border: 0; border-radius: 23px;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--tier); color: var(--on-tier); font-weight: 700; font-size: 14px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .5);
}
.cta .ic { font-size: 20px; line-height: 1; font-weight: 600; }
body[data-tier="gold"] .cta button { background: linear-gradient(135deg, #F7D96B, #D9A21B); }
.cta button:active { transform: scale(.98); }

/* ---------- Endübersicht ---------- */
.ended .num { color: var(--tier-text); }
body[data-tier="gold"].ended .num {
  background: linear-gradient(135deg, #F7D96B, #D9A21B); -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.sec {
  display: flex; align-items: center; gap: 10px; margin: 22px 0 10px;
  font: 600 11.5px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.lh { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 18px; }
.lh b { font: 700 24px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.lh span { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.chart { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.chart::-webkit-scrollbar { display: none; }
.col { flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.col[data-tier="red"]     { --c: #B3202A; --ct: #E0343F; }
.col[data-tier="orange"]  { --c: #ED8928; --ct: #ED8928; }
.col[data-tier="lime"]    { --c: #9CE04A; --ct: #9CE04A; }
.col[data-tier="emerald"] { --c: #28DE86; --ct: #28DE86; }
.col[data-tier="gold"]    { --c: #E1BE38; --ct: #E1BE38; }
.ci { height: 18px; font: 500 15px/1 var(--font-body); color: var(--muted); }
.col.cur .ci { color: var(--ink); }
.cc { display: flex; align-items: center; gap: 4px; height: 22px; margin: 12px 0 8px; }
.cc img { width: 22px; height: 22px; object-fit: contain; display: block; }
.cs { margin-bottom: 14px; font: 500 14px/1 var(--font-body); letter-spacing: .1em; color: rgba(255, 255, 255, .85); font-variant-numeric: tabular-nums; }

/* ================= Kreisliga Edition: Kickbase-Designsprache ================= */
:root {
  --kb-red: #ff4600; --kb-red-rgb: 255, 70, 0;
  --bg: #131417; --surface: #181c22; --raised: #22272e; --line: rgba(222, 228, 236, .12);
  --ink: #dee4ec; --muted: #a8adb4; --muted2: #7e8187;
  --font-display: 'Oxanium', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
body { font-size: 15px; }
.num, .rp, .pt, .chip, .big-clk, .scorebox, .auto .v, .log .p, .undo .tx b, .cv, .bt b, .gv, .rk, .stats4 b, .gbig, .lh b, .qc b { letter-spacing: -.02em; font-stretch: normal; }
.pname { font: 500 22px/1.2 var(--font-body); letter-spacing: 0; text-transform: none; color: rgba(255, 255, 255, .92); }
.num { font: 800 clamp(96px, 30vw, 136px)/1 var(--font-display); letter-spacing: -.035em; color: #f4f6f9; margin: 2px 0 10px; }
.num[data-len="4"] { font-size: clamp(76px, 23vw, 108px); }
.num[data-len="5"] { font-size: clamp(62px, 18vw, 88px); }
.sc { font: 500 30px/1.1 var(--font-body); letter-spacing: .06em; color: #eef1f5; }
.state { font: 500 16px/1.2 var(--font-body); letter-spacing: .07em; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; margin-top: 4px; }
.state.live { color: var(--kb-red); }
.state.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--kb-red); animation: kbpulse 1.4s ease-in-out infinite; }
@keyframes kbpulse { 50% { opacity: .2; } }
.row { grid-template-columns: 70px minmax(0, 1fr) auto; padding: 17px 18px 17px 16px; margin-bottom: 10px; border: 1px solid rgba(222, 228, 236, .13); border-radius: 12px; background: transparent; }
.rp { font: 700 22px/1 var(--font-display); }
.rl { font: 400 17px/1.25 var(--font-body); color: #eef1f5; }
.rt { font: 400 15px var(--font-body); color: var(--muted); }
.row.fresh { animation: rowin .8s cubic-bezier(.2, .8, .2, 1); }
@keyframes rowin { 0% { opacity: 0; transform: translateY(-12px); background: rgba(var(--tier-rgb), .3); } 55% { opacity: 1; transform: none; background: rgba(var(--tier-rgb), .18); } 100% { background: transparent; } }
.whistle { list-style: none; display: flex; justify-content: center; padding: 12px 0 4px; color: var(--muted2); }
.whistle svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  main.addEventListener('click', function (e) {
    var b = e.target.closest('[data-k],[data-do],[data-del]'); if (!b) return;
    if (b.hasAttribute('data-k')) addEvent(b.getAttribute('data-k'));
    else if (b.hasAttribute('data-do')) doAct(b.getAttribute('data-do'));
    else { var id = +b.getAttribute('data-del'); S.events = S.events.filter(function (x) { return x.id !== id; }); save(); renderEdit(); }
  });
  $('quick').addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (b) addEvent(b.getAttribute('data-k')); });
  $('undo').addEventListener('click', function (e) { if (e.target.closest('[data-do="undo"]')) doAct('undo'); });
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    tab = b.getAttribute('data-tab'); confirmReset = false; confirmEnd = false; confirmHist = false; renderEdit(); window.scrollTo(0, 0);
  });

  /* Bildschirm bleibt an, kurzes Vibrieren bei jedem Tipp auf eine Aktion */
  var wl = null;
  function keepAwake() {
    try {
      if (navigator.wakeLock && document.visibilityState === 'visible' && !wl) {
        navigator.wakeLock.request('screen').then(function (l) { wl = l; l.addEventListener('release', function () { wl = null; }); }).catch(function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', function (e) {
    keepAwake();
    try { if (navigator.vibrate && e.target.closest && e.target.closest('.act')) navigator.vibrate(12); } catch (x) {}
  });

  show('home');
  setInterval(tick, 1000);
})();
</script>

</body></html>
